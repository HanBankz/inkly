name: inkly
description: "A real-time collaborative drawing and whiteboard app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_colorpicker: ^1.1.0
  saver_gallery: ^4.1.2
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  scribble: ^0.10.0+1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/inkly.png